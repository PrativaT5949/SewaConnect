<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Customer Dashboard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../assets/css/dashboard.css" />
  </head>

  <body>
    <nav class="navbar navbar-dark bg-primary">
      <div class="container-fluid">
        <span class="navbar-brand"> SewaConnect </span>

        <div>
          <span id="username" class="text-white me-3"> Loading... </span>

          <button class="btn btn-light btn-sm" id="logoutBtn">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <h2>Customer Dashboard</h2>

      <p>Welcome back!</p>

      <div class="row">
        <div class="col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <h5>Total Bookings</h5>

              <h2 id="totalBookings">0</h2>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <h5>Pending</h5>

              <h2 id="pendingBookings">0</h2>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <h5>Completed</h5>

              <h2 id="completedBookings">0</h2>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <h5>Cancelled</h5>

              <h2 id="cancelledBookings">0</h2>
            </div>
          </div>
        </div>
      </div>

      <hr />

      <h4>Recent Bookings</h4>

      <div id="bookingList">Loading bookings...</div>
    </div>

    <script src="../assets/js/api.js"></script>

    <script src="../assets/js/dashboard.js"></script>
  </body>
</html>
